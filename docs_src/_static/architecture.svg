<path class="arr" d="M220,152 L258,152"/>
<path class="arr" d="M220,243 L258,243"/>
<path class="arr" d="M682,62 L718,62"/>
<path class="arr" d="M682,166 L718,166"/>
<path class="arr" d="M682,256 L718,256"/>
<path class="arr" d="M830,284 L830,318"/>
<rect class="b" x="20" y="320" width="200" height="90"/>
<text class="h" x="30" y="340">model.initialize(...)</text>
<text class="k" x="30" y="360">adiabat | milne | const |</text>
<text class="k" x="30" y="376">guillot | from file</text>
<text class="k" x="30" y="392">+ initial chemistry</text>
<path class="arr" d="M220,365 L258,365"/>
